<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wanderly — StayFinder</title><link rel="stylesheet" href="style.css"></head>
<body><header><nav><a class="logo" href="../destination-explorer/index.html">Wanderly</a><div class="nav-links"><a href="../destination-explorer/index.html">Explore</a><a href="../tripcraft/index.html">Trips</a><a class="active" href="#">Stays</a><a href="../travelmate/index.html">TravelMate</a></div></nav></header>
<main><section class="search-hero"><span class="eyebrow">STAYFINDER · ACCOMMODATION</span><h1>Find a stay you'll <span>love.</span></h1><div class="search-panel"><input id="location" value="Kyoto"><input type="date" value="2026-11-12"><input type="date" value="2026-11-18"><select id="guests"><option>2 Guests</option><option>1 Guest</option><option>3 Guests</option><option>4 Guests</option></select><button class="primary" id="search">Search</button></div></section>
<section class="results"><aside class="filters card"><h3>Filters</h3><label>Maximum price <strong id="priceLabel">₹12,000</strong><input id="price" type="range" min="3000" max="15000" value="12000" step="500"></label><label>Minimum rating<select id="rating"><option value="0">Any rating</option><option value="4.5">4.5+</option><option value="4.7">4.7+</option><option value="4.8">4.8+</option></select></label><label>Amenities</label><label class="check"><input type="checkbox" value="WiFi"> WiFi</label><label class="check"><input type="checkbox" value="Breakfast"> Breakfast</label><label class="check"><input type="checkbox" value="Pool"> Pool</label><button class="secondary full" id="clear">Clear filters</button></aside>
<div class="hotel-area"><div class="results-head"><div><span class="eyebrow">KYOTO</span><h2 id="count">6 stays</h2></div><select id="sort"><option value="recommended">Recommended</option><option value="price">Lowest price</option><option value="rating">Highest rating</option></select></div><div id="hotels" class="hotels"></div></div></section></main><div class="modal hidden" id="modal"><div class="modal-box"><button class="close" id="close">×</button><div id="modalContent"></div></div></div><footer>Wanderly Travel UI Collection · Demo data for educational use</footer><script src="script.js"></script></body></html>
